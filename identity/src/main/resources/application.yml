spring:
  application:
    name: identity
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity}
    username: ${DB_USERNAME:identity}
    password: ${DB_PASSWORD:identity}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

identity:
  rsa:
    key-id: ${RSA_KEY_ID:stampede-key-1}
  client:
    redirect-uri: ${CLIENT_REDIRECT_URI:http://localhost:3000/callback}
    post-logout-redirect-uri: ${CLIENT_POST_LOGOUT_REDIRECT_URI:http://localhost:3000}
  token:
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:10}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
