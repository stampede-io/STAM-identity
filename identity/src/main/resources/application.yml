spring:
  application:
    name: identity
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity}
    username: ${DB_USERNAME:identity}
    password: ${DB_PASSWORD:identity}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: identity-audit-log
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # STAM-452: bytes that aren't JSON would fail inside poll(), before the
      # error handler, and stall the partition forever. The wrapper turns
      # that into a non-retryable DeserializationException: logged, skipped.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.stampedeio.identity.audit
        spring.json.value.default.type: com.stampedeio.identity.audit.AuditEvent

server:
  port: ${SERVER_PORT:8084}
  # STAM-440: identity sits behind the gateway. Without this, Spring Security's
  # redirects (LoginUrlAuthenticationEntryPoint, the post-authorize bounce to
  # /login) are built from the raw request it sees — Host: identity:8080 inside
  # compose — instead of the external gateway origin the browser is actually
  # talking to. "framework" makes it honor the X-Forwarded-* headers Spring
  # Cloud Gateway already sends.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        startup:
          include: readinessState

demo:
  mode: ${DEMO_MODE:false}

identity:
  rsa:
    # STAM-454: RSA PKCS#8 private key (PEM or base64) shared by every restart
    # and replica. Unset = a key generated per start, local dev only. The kid
    # is the key's thumbprint, so it changes whenever the key does.
    private-key: ${IDENTITY_RSA_PRIVATE_KEY:}
  client:
    redirect-uri: ${CLIENT_REDIRECT_URI:http://localhost:3000/callback}
    post-logout-redirect-uri: ${CLIENT_POST_LOGOUT_REDIRECT_URI:http://localhost:3000}
  token:
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:10}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
