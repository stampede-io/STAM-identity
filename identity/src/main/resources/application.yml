spring:
  application:
    name: identity
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity}
    username: ${DB_USERNAME:identity}
    password: ${DB_PASSWORD:identity}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: identity-audit-log
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.stampedeio.identity.audit
        spring.json.value.default.type: com.stampedeio.identity.audit.AuditEvent

server:
  port: ${SERVER_PORT:8084}
  # STAM-440: identity sits behind the gateway. Without this, Spring Security's
  # redirects (LoginUrlAuthenticationEntryPoint, the post-authorize bounce to
  # /login) are built from the raw request it sees — Host: identity:8080 inside
  # compose — instead of the external gateway origin the browser is actually
  # talking to. "framework" makes it honor the X-Forwarded-* headers Spring
  # Cloud Gateway already sends.
  forward-headers-strategy: framework

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

identity:
  rsa:
    key-id: ${RSA_KEY_ID:stampede-key-1}
  client:
    redirect-uri: ${CLIENT_REDIRECT_URI:http://localhost:3000/callback}
    post-logout-redirect-uri: ${CLIENT_POST_LOGOUT_REDIRECT_URI:http://localhost:3000}
  token:
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:10}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
