# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for STAM-identity
# OAuth 2.1 Authorization Server. Security-critical - review assertively.
language: en-US
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "Dev"
      - "main"

  path_filters:
    - "!**/target/**"
    - "!**/.idea/**"
    - "!identity/org/**"
    - "!identity/META-INF/**"

  path_instructions:
    - path: "identity/src/main/java/com/stampedeio/identity/config/**"
      instructions: >
        Spring Authorization Server implementing OAuth 2.1 Authorization Code
        + PKCE (S256). The SPA client stampede-spa is a PUBLIC client. Flag as
        a must-fix: (1) any client secret introduced for stampede-spa,
        or config that would let it authenticate as a confidential client;
        (2) PKCE made optional - require-proof-key must stay true; (3) the
        code challenge method widened to allow plain instead of S256 only;
        (4) any weakening of refresh token rotation - every refresh must issue
        a new token and invalidate the old one, and a replayed token must
        revoke the entire family via FamilyAwareAuthorizationService
        (RefreshTokenRotationIT proves this); (5) token TTLs increased without
        justification in the PR description; (6) any change that would let a
        refresh token be returned somewhere other than an httpOnly cookie.

    - path: "identity/src/main/java/com/stampedeio/identity/**"
      instructions: >
        Flag any logging of tokens, authorization codes, code verifiers,
        password hashes, or full Authorization headers at ANY log level -
        logging a bearer token is a credential leak even at DEBUG. Flag
        password comparison that is not constant-time, and any credential
        stored without passing through the configured PasswordEncoder. Audit
        events go to the identity.audit Kafka topic (retention.ms=-1, kept
        indefinitely) - flag any change that makes an auth-relevant event
        (login, logout, token issued, reuse detected, role change) stop being
        audited. Flag any new endpoint under /api/v1/users/** that returns
        another user's data without checking the JWT subject against the
        requested user id.

    - path: "identity/src/main/resources/db/migration/*.sql"
      instructions: >
        Flyway is forward-only - flag edits to already-merged migrations. Flag
        any migration that would store a token or secret in plaintext, or that
        drops an index supporting refresh-token family lookup.

    - path: "identity/src/test/java/**"
      instructions: >
        AuthFlowIT, RefreshTokenRotationIT and AuditEventIT prove the security
        claims this service makes publicly. Flag added @Disabled, loosened
        assertions, or a Testcontainers dependency replaced with a mock. A
        reuse-detection test that no longer asserts family revocation is not a
        test.

    - path: "**/*.{yml,yaml}"
      instructions: >
        spring.jpa.hibernate.ddl-auto must remain validate. Flag any hardcoded
        credential, signing key, or connection string. A ${VAR:default}
        reference does NOT make it safe: a default that is a real value -
        e.g. ${JWT_SIGNING_KEY:fixture-secret} - still commits a usable
        signing key and must be flagged. Only a non-sensitive default
        (hostname, port, empty) is acceptable. Flag a committed JWK, keystore,
        or PEM.

  tools:
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    hadolint:
      enabled: true
    semgrep:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
